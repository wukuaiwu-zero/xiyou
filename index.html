<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>西游破劫录 - 抖音/微信小游戏 & 移动端横版像素肉鸽预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #0b0914;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* 浏览器预览专用快捷联调工具条（仅在进入关卡后贴底紧凑显示，选人界面自动隐藏不挡文案） */
    #devPanel {
      position: fixed;
      bottom: max(6px, env(safe-area-inset-bottom, 6px));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 6px;
      align-items: center;
      background: linear-gradient(180deg, rgba(28, 22, 48, 0.92), rgba(13, 10, 24, 0.96));
      border: 1px solid rgba(255, 209, 102, 0.62);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 4px 12px;
      z-index: 20;
      font-size: 11px;
      color: #e0fbfc;
      backdrop-filter: blur(6px);
    }
    #devPanel button {
      background: linear-gradient(180deg, #322a52, #1d1833);
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, 0.65);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
      box-shadow: 0 2px 0 #0d0a18;
    }
    #devPanel button:hover {
      background: linear-gradient(180deg, #483c73, #292248);
      border-color: #ffffff;
      color: #fff3b0;
      transform: translateY(-1px);
    }
    #devPanel button:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    #devPanel .hint {
      color: #cbd5e1;
      margin-right: 4px;
      letter-spacing: 0.2px;
    }
    @media (max-width: 760px) {
      #devPanel .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="devPanel">
    <span class="hint">键位: AD移动 | K跳(空中S+K下砸) | J普攻(4~5段循环) | 段数后+U派生技(裸按U本命神通) | L翻滚 | I法宝 | H甘露 | B披挂 | V招式谱 | F交互</span>
    <button id="btnTestTerrain" title="打开九九八十一难·十二大独立地域随机地形图鉴并自由选难">🗺 八十一难地形</button>
    <button id="btnTestCutscene" title="立即触发一段师徒隔空传音或重温破劫序章动画">💬 师徒传音</button>
    <button id="btnTestEquip" title="立即在脚下爆出一件高阶神品/圣品随机词条装备">✨ 爆神品装备</button>
    <button id="btnTestDeath" title="立即扣空血量以测试【死亡看激励视频满血复活】预留接口">🎬 测死亡复活</button>
    <button id="btnTestBoss" title="直接瞬移至本劫最右侧守关妖王殿">👹 瞬移打Boss</button>
    <button id="btnHideDev" title="隐藏底部调试条">×</button>
  </div>

  <!-- 按依赖顺序加载双端兼容模块（无需打包工具，支持直接双击或静态服务运行） -->
  <script src="./src/config/sdkConfig.js"></script>
  <script src="./src/config/characters.js"></script>
  <script src="./src/config/weapons.js"></script>
  <script src="./src/config/equipment.js"></script>
  <script src="./src/config/progressionCurve.js"></script>
  <script src="./src/config/tribulations81.js"></script>
  <script src="./src/config/terrainRegions81.js"></script>
  <script src="./src/config/biomes.js"></script>
  <script src="./src/config/dialogueBank.js"></script>
  <script src="./src/platform/env.js"></script>
  <script src="./src/sdk/douyinSDK.js"></script>
  <script src="./src/audio/soundFX.js"></script>
  <script src="./src/assets/monsters81Sprites.js"></script>
  <script src="./src/assets/equipAndMatSprites.js"></script>
  <script src="./src/assets/heroModelEngine.js"></script>
  <script src="./src/assets/pixelSprites.js"></script>
  <script src="./src/assets/assetLoader.js"></script>
  <script src="./src/world/terrainRenderer.js"></script>
  <script src="./src/world/levelGen.js"></script>
  <script src="./src/entities/effects.js"></script>
  <script src="./src/entities/player.js"></script>
  <script src="./src/entities/enemy.js"></script>
  <script src="./src/ui/uiTheme.js"></script>
  <script src="./src/ui/bestiaryModal.js"></script>
  <script src="./src/ui/hudAndModals.js"></script>
  <script src="./src/core/gameApp.js"></script>
  <script src="./src/core/curveDirector.js"></script>
  <script src="./src/core/equipForgeDirector.js"></script>
  <script src="./src/core/actionMovesetDirector.js"></script>
  <script src="./src/ui/cutsceneDirector.js"></script>
  <script src="./src/platform/systemOptimizer.js"></script>

  <script>
    (function () {
      const SDK_CONFIG = window.XiyouRegistry.sdkConfig;
      // 演示外部埋点与服务端钩子预留回调日志
      SDK_CONFIG.externalHooks.onTrackEvent = function (eventName, payload) {
        console.log('[DouyinSDK 预留埋点钩子]', eventName, payload);
      };
      SDK_CONFIG.externalHooks.onPlayerRevived = function (info) {
        console.log('[DouyinSDK 玩家看广告复活成功回调]', info);
      };

      const { GameApp } = window.XiyouRegistry.gameApp;
      const app = new GameApp();
      app.boot();
      window.__xiyouGame = app;

      // 支持 URL 参数快速直达指定联调场景（如 ?autostart=bailongma 或 ?preview=revive）
      const params = new URLSearchParams(window.location.search);
      if (params.get('autostart')) {
        app.startNewRun(params.get('autostart'));
      } else if (params.get('preview') === 'revive') {
        app.startNewRun('wukong');
        app.player.invulnTimer = 0;
        app.handleHitPlayer(99999, -1);
      } else if (params.get('preview') === 'boss') {
        app.startNewRun('bailongma');
        app.player.placeAt(app.level.bossArenaStartPx + 42, app.level.bossSpawn.y);
        app.tick(0.1);
      } else if (params.get('preview') === 'equip') {
        app.startNewRun('wukong');
        app.spawnEquipmentDrop(app.player.x + 20, app.player.y, 'boss');
        const drop = app.level.interactables[app.level.interactables.length - 1];
        app.triggerInteract(drop);
      } else if (params.get('preview') === 'bestiary') {
        app.modal = 'BESTIARY_81';
      } else if (params.get('preview') === 'terrain') {
        app.modal = 'TERRAIN_ATLAS';
      } else if (params.get('trib')) {
        app.startNewRun(params.get('char') || 'wukong', { tribulationNo: Number(params.get('trib')) || 1 });
      } else if (params.get('preview') === 'bag') {
        app.startNewRun('wukong');
        const { generateEquipment } = window.XiyouRegistry.equipment;
        app.player.equipItem(generateEquipment(5, { templateId: 'ruyi_jingu_staff', forceRarityIndex: 4 }));
        app.player.equipItem(generateEquipment(5, { templateId: 'phoenix_crown', forceRarityIndex: 4 }));
        app.player.equipItem(generateEquipment(6, { templateId: 'golden_mail', forceRarityIndex: 5 }));
        app.player.equipItem(generateEquipment(5, { templateId: 'cloud_silk_boots', forceRarityIndex: 4 }));
        app.player.equipItem(generateEquipment(4, { slot: 'accessory', forceRarityIndex: 3 }));
        app.inspectSlot = 'armor';
        app.equipPanelTab = 'EQUIP';
        app.modal = 'EQUIP_PANEL';
      } else if (params.get('preview') === 'forge') {
        app.equipPanelTab = 'FORGE';
        app.modal = 'EQUIP_PANEL';
      } else if (params.get('preview') === 'mats') {
        app.equipPanelTab = 'MATS';
        app.modal = 'EQUIP_PANEL';
      } else if (params.get('preview') === 'prologue') {
        app.cutscene && app.cutscene.startPrologue();
      } else if (params.get('preview') === 'boss_cutscene') {
        app.startNewRun(params.get('char') || 'wukong', { skipPrologue: true, skipAspectModal: true });
        app.player.placeAt(app.level.bossArenaStartPx + 42, app.level.bossSpawn.y);
        app.tick(0.05);
      }

      document.getElementById('btnTestCutscene').addEventListener('click', function () {
        if (app.state === 'PLAYING' && app.player && window.XiyouRegistry.dialogueBank) {
          const b = window.XiyouRegistry.dialogueBank.drawStageBanter(app.saveData, {
            charId: app.player.id,
            regionId: app.level && app.level.region ? app.level.region.id : undefined
          });
          app.persistSave();
          app.cutscene && app.cutscene.pushLiveBanter(b);
        } else if (app.cutscene) {
          app.cutscene.startPrologue();
        }
      });

      document.getElementById('btnTestTerrain').addEventListener('click', function () {
        app.modal = 'TERRAIN_ATLAS';
      });

      document.getElementById('btnTestEquip').addEventListener('click', function () {
        if (app.state !== 'PLAYING') {
          app.startNewRun(app.selectedCharId);
        }
        if (app.player && app.level) {
          app.spawnEquipmentDrop(app.player.x + app.player.dir * 22, app.player.y, 'boss');
        }
      });

      document.getElementById('btnTestDeath').addEventListener('click', function () {
        if (app.state !== 'PLAYING') {
          app.startNewRun(app.selectedCharId);
        }
        if (app.player && !app.player.dead) {
          app.player.invulnTimer = 0;
          app.player.reviveAuraTimer = 0;
          app.player.shieldHp = 0;
          app.handleHitPlayer(99999, -1);
        }
      });

      document.getElementById('btnTestBoss').addEventListener('click', function () {
        if (app.state !== 'PLAYING') {
          app.startNewRun(app.selectedCharId);
        }
        if (app.player && app.level) {
          app.player.placeAt(app.level.bossArenaStartPx + 36, app.level.bossSpawn.y);
        }
      });

      let devHidden = false;
      setInterval(function () {
        const panel = document.getElementById('devPanel');
        if (!panel || devHidden) return;
        panel.style.display = (app.state === 'PLAYING' && !app.modal) ? 'flex' : 'none';
      }, 200);

      document.getElementById('btnHideDev').addEventListener('click', function () {
        devHidden = true;
        document.getElementById('devPanel').style.display = 'none';
      });
    })();
  </script>
</body>
</html>
